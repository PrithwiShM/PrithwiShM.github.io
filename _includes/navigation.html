<nav class="site-navigation" aria-label="Primary navigation">
  <div class="navigation-container">
    <a
      class="navigation-link{% if page.url == '/' %} active{% endif %}"
      href="{{ '/' | relative_url }}"
      aria-label="Go to homepage"
      {% if page.url == '/' %}
        aria-current="page"
      {% endif %}
    >
      Home
    </a>

    <a
      class="navigation-link{% if page.url contains '/projects' %} active{% endif %}"
      href="{{ '/projects/' | relative_url }}"
      {% if page.url contains '/projects' %}
        aria-current="page"
      {% endif %}
    >
      Projects
    </a>

    <a
      class="navigation-link{% if page.url contains '/blogs' %} active{% endif %}"
      href="{{ '/blogs/' | relative_url }}"
      {% if page.url contains '/blogs' %}
        aria-current="page"
      {% endif %}
    >
      Blogs
    </a>

    <a
      class="navigation-link{% if page.url contains '/contact' %} active{% endif %}"
      href="{{ '/contact/' | relative_url }}"
      {% if page.url contains '/contact' %}
        aria-current="page"
      {% endif %}
    >
      Contact
    </a>
  </div>
</nav>
